name: SBI Workspace UI and Private Tasks QA
on:
  push:
    branches:
      - feature/sbi-aws-workspace-ui-notes-20261119
  pull_request:
    branches:
      - fix/sbi-aws-control-tower-in-app-tab-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated Firebase auth and Flask runtime
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Run workspace note/task CRUD, isolation, CSRF and UI tests
        run: python -m unittest discover -s tests -p 'test_sbi_aws_workspace_ui.py' -v
      - name: Control Tower integration regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_control_tower.py' -v
      - name: Tab integration regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_control_tower_tab.py' -v
      - name: Firebase Login v1.5 regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_login_v150.py' -v
      - name: Build nonroot isolated release image
        run: docker build -f staging/aws_login_v150/Dockerfile --build-arg SBI_SOURCE_SHA="$GITHUB_SHA" -t sbi-aws-workspace-qa:local .
      - name: Disconnected HTTP guard smoke
        run: |
          docker run -d --name sbi-aws-workspace-qa --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges sbi-aws-workspace-qa:local
          for i in $(seq 1 20); do
            if docker exec sbi-aws-workspace-qa python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)" >/dev/null 2>&1;then break;fi
            sleep 1
          done
          docker exec -i sbi-aws-workspace-qa python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          def status(path):
              try: return urlopen('http://127.0.0.1:8080'+path,timeout=5).status
              except HTTPError as e:return e.code
          assert status('/healthz')==200
          assert status('/login')==200
          for route in ('/control-tower','/control-tower?embedded=1',
                        '/control-tower/api/workspace','/control-tower/theme.css',
                        '/dashboard-theme.css','/api/reports'):
              assert status(route)==401,(route,status(route))
          print('WORKSPACE_DISCONNECTED_HTTP=PASS')
          PY
      - name: Remove isolated QA container
        if: always()
        run: docker rm -f sbi-aws-workspace-qa 2>/dev/null || true
