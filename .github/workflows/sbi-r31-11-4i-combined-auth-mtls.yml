name: SBI R31.11.4I combined auth evidence + mTLS readiness (mock CI)
on:
  push:
    branches: [feature/sbi-r31-11-4i-combined-auth-mtls-readiness-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-combined-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only mock QA dependencies
        run: python -m pip install --disable-pip-version-check 'Flask>=3,<4' 'firebase-admin>=6,<8'
      - name: Static compile and combined fail-closed tests (NO AWS, no real users)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile staging/aws_login_v150/r31_11_4i_combined_auth_mtls.py
          python -B -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_4i_*.py' -v
          python -B -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_4h_*.py' -v
          python -B -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_4g_mtls_readonly_preflight.py' -v
      - name: Block unsafe release claims or implicit execution
        shell: bash
        run: |
          set -euo pipefail
          F=staging/aws_login_v150/r31_11_4i_combined_auth_mtls.py
          grep -Fq 'DB_R31_11_4I_EXTERNAL_MTLS_HTTPS=NOT_TESTED' "$F"
          grep -Fq 'DB_R31_11_4I_FINANCIAL_APPLY=LOCKED' "$F"
          grep -Fq 'DB_R31_11_4I_PRODUCTION_RELEASE=BLOCKED' "$F"
          grep -Fq 'R3114I_TWO_REAL_FIREBASE_TEST_USERS_QA_ONLY' "$F"
          grep -Fq 'R31_11_4I_NEW_AUTH_RECEIPT=PASS_LOCAL_MODE0600_NO_SECRETS' "$F"
          ! grep -En 'FINANCIAL_APPLY=ENABLED|CREATE ROLE|DROP DATABASE|CREATE DATABASE|--publish|docker.*--network host|CADDYFILE_WRITE' "$F"
