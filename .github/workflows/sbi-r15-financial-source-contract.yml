name: SBI R15 Financial Original-Source Read-only Contract (synthetic only)
on:
  push:
    branches:
      - review/sbi-r15-financial-source-contract-preflight-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15-synthetic-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Excel reader only
        run: python -m pip install 'openpyxl>=3.1.5,<4'
      - name: Validate isolated R15 financial source contract
        env:
          CI: "true"
          SBI_FINANCIAL_APPLY: "LOCKED"
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r15_financial_source_preflight.py
          python -m unittest discover -s tests -p 'test_sbi_r15_financial_source_preflight.py' -v
          echo 'R15_ORIGINAL_SOURCE_CONTRACT_SYNTHETIC=PASS'
          echo 'R15_V251_ALLOCATION_ENGINE=NOT_CONNECTED'
          echo 'R15_POSTGRESQL=NOT_CONNECTED'
          echo 'R15_FINANCIAL_WRITER=NOT_EXECUTED'
          echo 'R15_FINANCIAL_APPLY=LOCKED'
