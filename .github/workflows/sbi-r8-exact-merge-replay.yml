name: SBI R8 Exact Development Merge Staging QA (no cloud)
on:
  push:
    branches:
      - review/sbi-r8-merged-staging-exact-sha-qa-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-staging-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R8_PINNED_MERGE_SHA: 3daaeeed33465307b82dab8569abd55fc42416b7
    steps:
      - name: Check out exact development merge, not moving review branch
        uses: actions/checkout@v5
        with:
          ref: 3daaeeed33465307b82dab8569abd55fc42416b7
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert exact source SHA and fail-closed staging artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$R8_PINNED_MERGE_SHA"
          bash -n scripts/ci/sbi_r8_staging_image_canary.sh
          test -f staging/aws_login_v150/Dockerfile.r8_staging
          grep -Fq '2026-11-23T00:00:00+05:30' staging/aws_login_v150/reconciliation_review_adapter.py
          echo "R8_EXACT_MERGE_SHA=$R8_PINNED_MERGE_SHA"
      - name: Install isolated Python app dependencies
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Run all 19 separate staging runtime guard tests
        run: python -m unittest discover -s tests -p 'test_sbi_r8_staging_runtime.py' -v
      - name: Run existing 19 Flask payment and reconciliation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
          python -m unittest discover -s tests -p 'test_sbi_reconciliation_readiness.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r4_readonly_flask_http.py' -v
      - name: Build exact merged R8 staging image only
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f staging/aws_login_v150/Dockerfile.r8_staging \
            --build-arg SBI_SOURCE_SHA="$R8_PINNED_MERGE_SHA" \
            -t "sbi-r8-staging:$R8_PINNED_MERGE_SHA" .
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "sbi-r8-staging:$R8_PINNED_MERGE_SHA")" = "$R8_PINNED_MERGE_SHA"
          echo 'R8_IMMUTABLE_STAGING_DOCKER_IMAGE=PASS'
      - name: Run offline denial health and rollback against exact merge image
        shell: bash
        env:
          R8_STAGING_IMAGE: sbi-r8-staging:3daaeeed33465307b82dab8569abd55fc42416b7
          R8_STAGING_SHA: 3daaeeed33465307b82dab8569abd55fc42416b7
        run: bash scripts/ci/sbi_r8_staging_image_canary.sh
      - name: Always verify temporary test container absent
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker ps -a --filter 'name=^/sbi-r8-ci-' --format '{{.Names}}' | grep -q .; then
            exit 1
          fi
          echo 'R8_EXACT_MERGE_CANARY_ROLLBACK=PASS'
