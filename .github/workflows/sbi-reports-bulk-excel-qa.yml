name: SBI Reports Bulk Excel Generator QA
on:
  push:
    branches: [feature/sbi-reports-bulk-excel-generator-20261121]
  pull_request:
    branches: [feature/sbi-aws-readonly-reports-source-gate-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk-report-no-financial-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install sealed AWS application dependencies
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Pin blue-green deployment script and syntax
        run: |
          bash -n staging/aws_login_v150/deploy_bulk_reports_v1.sh
          python -m unittest discover -s tests -p 'test_sbi_bulk_report_deploy.py' -v
      - name: Bulk Report functional and security QA
        run: python -m unittest discover -s tests -p 'test_sbi_bulk_reports.py' -v
      - name: Database Update navigation parity
        run: python -m unittest discover -s tests -p 'test_sbi_database_update_nav.py' -v
      - name: Certified source-only Reports regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_readonly_reports_gateway.py' -v
      - name: Payment evidence receipt regression
        run: python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
      - name: Firebase session regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_login_v150.py' -v
      - name: Build isolated nonroot AWS container
        run: docker build -f staging/aws_login_v150/Dockerfile --build-arg SBI_SOURCE_SHA="$GITHUB_SHA" -t sbi-bulk-reports-qa:local .
      - name: Disconnected HTTP and finance-denial checks
        run: |
          docker run -d --name sbi-bulk-reports-qa --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges sbi-bulk-reports-qa:local
          for i in $(seq 1 20); do
            if docker exec sbi-bulk-reports-qa python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)" >/dev/null 2>&1;then break;fi
            sleep 1
          done
          docker exec -i sbi-bulk-reports-qa python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          def status(path,method="GET"):
              try:return urlopen(Request("http://127.0.0.1:8080"+path,method=method),timeout=5).status
              except HTTPError as err:return err.code
          assert status("/healthz")==200
          assert status("/login")==200
          assert status("/api/bulk-report/status")==401
          assert status("/api/bulk-report/generate","POST")==403
          assert status("/api/payment-reconciliation/run","POST")==403
          assert status("/api/upload","POST")==403
          print("BULK_REPORT_DISCONNECTED_HTTP=PASS")
          PY
      - name: Remove QA container
        if: always()
        run: docker rm -f sbi-bulk-reports-qa 2>/dev/null || true
