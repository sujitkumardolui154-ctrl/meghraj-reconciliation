name: SBI Autonomous Staging Deployment
on:
  pull_request:
    branches: [main, automation/sbi-deployment-agent-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sbi-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consolidated-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tracked Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess
          for name in filter(None, subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")):
              p = pathlib.Path(name)
              if p.suffix == ".py" and p.is_file():
                  ast.parse(p.read_text(encoding="utf-8-sig"), filename=name)
          PY
      - name: Run recovered-source financial contract tests
        run: python -m unittest discover -s tests -p 'test_financial_contract.py' -v
      - name: Verify completed-import receipt ledger gate (synthetic, read-only)
        run: python -m unittest discover -s tests -p 'test_import_receipt_audit.py' -v
      - name: Install reporting authentication test dependencies
        run: python -m pip install -r dashboard_source/requirements.txt
      - name: Verify CREDIT NOTE Firebase session and read-only report permissions
        run: python -m unittest discover -s tests -p 'test_credit_note_auth_contract.py' -v
      - name: Verify CREDIT NOTE snapshot count and conflict integrity
        run: python -m unittest discover -s tests -p 'test_credit_note_snapshot_integrity.py' -v
      - name: Verify R2 dataset and report audit safety (synthetic, read-only)
        run: python -m unittest discover -s tests -p 'test_sbi_r2_read_only_audit.py' -v
      - name: Check candidate prerequisites
        id: readiness
        shell: bash
        run: |
          # Reporting-only candidate has an independent gate. It MUST NOT
          # consume or bypass the separate financial-engine certification.
          # These candidate files are deliberately absent until reviewed.
          candidate=deployment/reporting_staging
          if [[ -f "$candidate/Dockerfile" &&
                -f "$candidate/requirements.txt" &&
                -f "$candidate/reporting_release_approval.json" ]]; then
            python - "$candidate/reporting_release_approval.json" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              approval = json.load(source)
          required = (
              approval.get("release_scope") == "reporting_only"
              and approval.get("decision") == "APPROVED_FOR_PRIVATE_STAGING"
              and approval.get("source_sha") == os.environ["GITHUB_SHA"]
              and bool(re.fullmatch(r"[0-9a-f]{64}", str(approval.get("dataset_sha256", ""))))
              and bool(approval.get("reviewer"))
              and approval.get("private_evidence_verified") is True
              and approval.get("financial_execution") == "RESTRICTED"
          )
          if not required:
              sys.exit("Reporting-only independent release evidence is incomplete")
          PY
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private reporting candidate image and independently reviewed reporting evidence are missing; deployment remains disabled."
          fi

  zero-traffic-candidate:
    needs: consolidated-source-qa
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.consolidated-source-qa.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: meghraj-reconciliation
          workload_identity_provider: projects/109590290120/locations/global/workloadIdentityPools/sbi-github-pool/providers/github-oidc
          service_account: sbi-staging-agent@meghraj-reconciliation.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy candidate with no traffic
        run: |
          gcloud run deploy sbi-reconciliation-api \
            --project meghraj-reconciliation \
            --region asia-south1 \
            --source deployment/staging \
            --no-traffic \
            --quiet
      - name: Declare traffic policy
        run: echo "No traffic promotion or financial data mutation authorized by this workflow."
