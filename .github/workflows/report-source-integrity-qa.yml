name: Reports Source Integrity QA

on:
  pull_request:
    paths:
      - 'backend_source/report_api.py'
      - 'backend_source/report_source_integrity.py'
      - 'backend_source/test_report_source_integrity.py'
      - '.github/workflows/report-source-integrity-qa.yml'
  push:
    branches:
      - 'fix/reports-a01-a08-source-integrity-20261105'
    paths:
      - 'backend_source/report_api.py'
      - 'backend_source/report_source_integrity.py'
      - 'backend_source/test_report_source_integrity.py'
      - '.github/workflows/report-source-integrity-qa.yml'

permissions:
  contents: read

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Run offline Python integrity regression
        run: |
          cd backend_source
          python3 -m unittest -v test_report_source_integrity
      - name: Verify syntax without importing cloud modules
        run: |
          python3 -m py_compile backend_source/report_api.py backend_source/report_source_integrity.py
