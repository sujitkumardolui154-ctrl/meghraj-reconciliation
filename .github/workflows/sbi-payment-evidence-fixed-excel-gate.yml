name: SBI Payment Evidence Fixed Excel QA
on:
  push:
    branches: [feature/sbi-payment-evidence-fixed-xlsx-upload-20261120]
  pull_request:
    branches: [feature/sbi-database-update-payment-nav-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-excel-upload-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated Flask, Firebase and Excel runtime
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Fixed template, staged receipt, CSRF and financial-deny tests
        run: python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
      - name: Previous database navigation regression
        run: python -m unittest discover -s tests -p 'test_sbi_database_update_nav.py' -v
      - name: Control Tower and private notes/task regression
        run: python -m unittest discover -s tests -p 'test_sbi_control_tower_board_v2.py' -v
      - name: Existing Firebase login tests
        run: python -m unittest discover -s tests -p 'test_sbi_aws_login_v150.py' -v
      - name: Build standalone nonroot staging image
        run: docker build --build-arg SBI_SOURCE_SHA="$GITHUB_SHA" -f staging/aws_login_v150/Dockerfile -t sbi-payment-evidence-qa:local .
      - name: Network-disconnected HTTP guards
        run: |
          docker run -d --name sbi-payment-evidence-qa --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges sbi-payment-evidence-qa:local
          for i in $(seq 1 20); do
            if docker exec sbi-payment-evidence-qa python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)" >/dev/null 2>&1;then break;fi
            sleep 1
          done
          docker exec -i sbi-payment-evidence-qa python3 - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          def status(path):
              try:return urlopen('http://127.0.0.1:8080'+path,timeout=5).status
              except HTTPError as error:return error.code
          assert status('/healthz')==200
          assert status('/login')==200
          for path in ('/api/payment-evidence/template','/api/payment-evidence/uploads',
                      '/control-tower','/api/reports','/api/payment-reconciliation/run'):
              assert status(path)==401,(path,status(path))
          print('SBI_PAYMENT_EVIDENCE_DISCONNECTED_HTTP=PASS')
          PY
      - name: Destroy QA container only
        if: always()
        run: docker rm -f sbi-payment-evidence-qa 2>/dev/null || true
