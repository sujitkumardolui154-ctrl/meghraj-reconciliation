name: DB-R31.11.4C Real Password LOGIN Role RLS Synthetic QA
on:
  push:
    branches:
      - feature/sbi-r31-11-4c-firebase-bound-logins-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-targeted-role-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sbi_r31_11_4_auth_qa_20261126
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-r3114c-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 8s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-disposable-r3114c-only
      PGDATABASE: sbi_r31_11_4_auth_qa_20261126
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal disposable PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run focused offline Firebase identity/secret/SQL guard tests
        run: |
          python -m unittest discover -s staging/aws_login_v150 \
            -p 'test_r31_11_4c_firebase_bound_login_roles.py' -v
          python -m py_compile staging/aws_login_v150/r31_11_4c_firebase_bound_login_roles.py
      - name: Install already validated isolated R31.11.4B schema in CI PostgreSQL
        run: |
          psql -X -qAt -v ON_ERROR_STOP=1 \
            -f staging/aws_login_v150/r31_11_4b_schema_only_up.sql
      - name: Apply synthetic-only two-login SQL with disposable public passwords
        run: |
          PYTHONPATH=staging/aws_login_v150 python - <<'PY'
          import r31_11_4c_firebase_bound_login_roles as stage
          records=[
            {"db_role":"r3113_login_a","uid":"firebase-user-a","email":"user-a@example.invalid"},
            {"db_role":"r3113_login_b","uid":"firebase-user-b","email":"user-b@example.invalid"},
          ]
          with open("/tmp/r3114c-disposable-only.sql","w",encoding="utf-8") as f:
              f.write(stage.build_provision_sql(records,("C"*64,"D"*64)))
          PY
          psql -X -qAt -v ON_ERROR_STOP=1 -f /tmp/r3114c-disposable-only.sql |
            grep -Fx 'R3114C_PRIVATE_ROLE_MAP_COMMITTED'
          test "$(psql -X -qAt -c "SELECT count(*) FROM r311_auth.role_owner_map")" = "2"
          test "$(psql -X -qAt -c "SELECT count(*) FROM pg_auth_members WHERE inherit_option AND NOT set_option AND NOT admin_option AND roleid IN (SELECT oid FROM pg_roles WHERE rolname IN ('r311_qa_tenant_a','r311_qa_tenant_b'))")" = "2"
      - name: Synthetic CI fixture (fake UIDs only, no real payments)
        run: |
          psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO sbi.import_batches(
            id,source_system,source_kind,source_sha256,owner_uid
          ) VALUES
            ('11111111-1111-4111-8111-111111111111','excel','payment',repeat('a',64),'firebase-user-a'),
            ('22222222-2222-4222-8222-222222222222','excel','payment',repeat('b',64),'firebase-user-b');
          INSERT INTO sbi.payment_source_rows(
            id,batch_id,source_row_number,original_values,row_sha256
          ) VALUES
            ('33333333-3333-4333-8333-333333333333',
             '11111111-1111-4111-8111-111111111111',2,
             '{"Description":"CI ONLY A","SOL ID":"001505","Credit Amount":"118.00"}'::jsonb,repeat('c',64)),
            ('44444444-4444-4444-8444-444444444444',
             '22222222-2222-4222-8222-222222222222',2,
             '{"Description":"CI ONLY B","SOL ID":"001506","Credit Amount":"357.00"}'::jsonb,repeat('d',64));
          INSERT INTO sbi.payments(id,source_row_id,description,sol_id,credit_paise) VALUES
            ('55555555-5555-4555-8555-555555555555',
             '33333333-3333-4333-8333-333333333333','CI ONLY A','001505',11800),
            ('66666666-6666-4666-8666-666666666666',
             '44444444-4444-4444-8444-444444444444','CI ONLY B','001506',35700);
          INSERT INTO sbi.payment_source_status_v1(
            source_row_id,source_status,reason_codes,parser_version
          ) VALUES
            ('33333333-3333-4333-8333-333333333333',
             'PENDING_RECONCILIATION','[]','CI_ONLY'),
            ('44444444-4444-4444-8444-444444444444',
             'PENDING_RECONCILIATION','[]','CI_ONLY');
          SQL
      - name: Prove real password-authenticated login A and B have database-enforced owner isolation
        run: |
          export PGUSER=r3113_login_a PGPASSWORD="$(printf 'C%.0s' {1..64})"
          test "$(psql -X -qAt -c "SELECT current_user || ':' || r311_auth.current_tenant_uid()")" = "r3113_login_a:firebase-user-a"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.payment_received_source_v1")" = "1"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.import_batches WHERE owner_uid='firebase-user-b'")" = "0"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.payments")" = "1"
          test "$(psql -X -qAt -c "SELECT count(*) FROM r311_auth.role_owner_map" 2>/dev/null || echo DENIED)" = "DENIED"
          test "$(psql -X -qAt -c "SELECT has_table_privilege('sbi.payments','INSERT') OR has_table_privilege('sbi.payments','UPDATE') OR has_table_privilege('sbi.payments','DELETE')")" = "f"
          export PGUSER=r3113_login_b PGPASSWORD="$(printf 'D%.0s' {1..64})"
          test "$(psql -X -qAt -c "SELECT current_user || ':' || r311_auth.current_tenant_uid()")" = "r3113_login_b:firebase-user-b"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.payment_received_source_v1")" = "1"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.import_batches WHERE owner_uid='firebase-user-a'")" = "0"
          test "$(psql -X -qAt -c "SELECT count(*) FROM sbi.payments")" = "1"
          test "$(psql -X -qAt -c "SELECT has_table_privilege('sbi.payments','INSERT')")" = "f"
      - name: Ensure role/mapping provisioning cannot be replayed
        run: |
          if psql -X -qAt -v ON_ERROR_STOP=1 -f /tmp/r3114c-disposable-only.sql >/tmp/r3114c-retry.log 2>&1; then
            echo 'FAIL_REPLAY_WAS_ACCEPTED'
            exit 1
          fi
          test "$(psql -X -qAt -c "SELECT count(*) FROM r311_auth.role_owner_map")" = "2"
          test "$(psql -X -qAt -d postgres -c "SELECT count(*) FROM pg_database WHERE datname='sbi_reconciliation_main'")" = "0"
          rm -f /tmp/r3114c-disposable-only.sql /tmp/r3114c-retry.log
