name: SBI NEW engine combined Stage 4.2-4.5 QA
on:
  pull_request:
    paths:
      - "staging/fresh_financial_engine/stage42/**"
      - ".github/workflows/sbi-stage42-combined-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and pin v2.18 manifest
        run: |
          python -m py_compile staging/fresh_financial_engine/stage42/combined_review.py
          cd staging/fresh_financial_engine/stage42
          echo '1cd0ee356dba943b0a0d40f7d5679f17127627e148b01e5c714a8ebfc3f7b04e  references/V218_OUTPUT_HEADER_LOCK_MANIFEST.json' | sha256sum -c
      - name: Consolidated stdlib source / ledger safety tests
        run: |
          PYTHONPATH=staging/fresh_financial_engine/stage4 \
            python -m unittest discover -s staging/fresh_financial_engine/stage4/tests -p 'test_*.py' -q
          PYTHONPATH=staging/fresh_financial_engine/stage42 \
            python -m unittest discover -s staging/fresh_financial_engine/stage42/tests -p 'test_source_contract_ci.py' -q
          PYTHONPATH=staging/fresh_financial_engine/stage41 \
            python -m unittest discover -s staging/fresh_financial_engine/stage41/tests -p 'test_manifest_contract_ci.py' -q
          echo 'COMBINED_STDLIB_SOURCE_QA=PASS'
      - name: Synthetic workbook integration if artifact_tool available
        run: |
          if python -c 'import artifact_tool' >/dev/null 2>&1; then
            PYTHONPATH=staging/fresh_financial_engine/stage42:staging/fresh_financial_engine/stage41:staging/fresh_financial_engine/stage4 \
              python -m unittest discover -s staging/fresh_financial_engine/stage42/tests -p 'test_combined_review.py' -q
            PYTHONPATH=staging/fresh_financial_engine/stage41 \
              python -m unittest discover -s staging/fresh_financial_engine/stage41/tests -p 'test_v218_writer.py' -q
            echo 'COMBINED_WORKBOOK_FUNCTIONAL_QA=PASS'
          else
            echo '::warning::artifact_tool not installed on this runner; combined workbook test NOT RUN in GitHub. Separate 85-test local full-runtime result exists; independent functional certification still pending.'
            echo 'COMBINED_WORKBOOK_FUNCTIONAL_QA=NOT_RUN_RUNTIME_UNAVAILABLE'
          fi
      - name: Financial writes remain disabled
        run: |
          echo 'HISTORICAL_BANK_INPUTS=NOT_USED_BY_CI'
          echo 'AWS_STAGE42_DEPLOYMENT=NOT_PERFORMED'
          echo 'FINANCIAL_PRODUCTION_APPLY=LOCKED'
