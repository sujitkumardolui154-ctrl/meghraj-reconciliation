name: SBI Credit Note future import guards (isolated QA)

on:
  push:
    branches:
      - feature/sbi-cn-future-import-guards-20261112
    paths:
      - backend_source/credit_note_validation.py
      - backend_source/credit_note_import_preview.py
      - backend_source/credit_note_registry_readonly.py
      - backend_source/credit_note_registry_audit.py
      - dashboard_source/sbi_cn_staging_preview.py
      - staging/sbi_cn_isolated_stage_app.py
      - backend_source/credit_note_import_file.py
      - backend_source/invoice_import_preview.py
      - tests/test_credit_note_import_preview_v2.py
      - tests/test_credit_note_invoice_preview_bridge.py
      - tests/test_credit_note_registry_preview.py
      - tests/test_credit_note_staging_http_and_index_audit.py
      - tests/test_sbi_cn_isolated_app_e2e.py
      - .github/workflows/sbi-cn-future-import-guards-qa.yml
      - tools/sbi_cn_combined_remaining_qa.py
      - tools/sbi_cn_external_readiness_preflight.py
      - tests/test_sbi_cn_external_readiness_preflight.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic-qa:
    if: github.ref == 'refs/heads/feature/sbi-cn-future-import-guards-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile isolated modules
        run: |
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import ast
          from pathlib import Path
          paths = (
              "backend_source/credit_note_validation.py",
              "backend_source/credit_note_import_preview.py",
              "backend_source/credit_note_registry_readonly.py",
              "backend_source/credit_note_registry_audit.py",
              "dashboard_source/sbi_cn_staging_preview.py",
              "staging/sbi_cn_isolated_stage_app.py",
              "backend_source/credit_note_import_file.py",
              "backend_source/invoice_import_preview.py",
              "tests/test_credit_note_import_preview_v2.py",
              "tests/test_credit_note_invoice_preview_bridge.py",
              "tests/test_credit_note_registry_preview.py",
              "tests/test_credit_note_staging_http_and_index_audit.py",
              "tests/test_sbi_cn_isolated_app_e2e.py",
              "tools/sbi_cn_combined_remaining_qa.py",
              "tools/sbi_cn_external_readiness_preflight.py",
              "tests/test_sbi_cn_external_readiness_preflight.py",
          )
          for filename in paths:
              ast.parse(Path(filename).read_text(encoding="utf-8"), filename=filename)
          print("SOURCE_SYNTAX_QA=PASS")
          PY
      - name: Install dashboard authentication and Excel test dependencies
        run: python -m pip install -r dashboard_source/requirements.txt openpyxl==3.1.5
      - name: Combined remaining read-only QA (all available local gates)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B tools/sbi_cn_combined_remaining_qa.py
          python -B -m unittest discover -s tests -p 'test_sbi_cn_external_readiness_preflight.py' -v
          echo 'EXTERNAL_RELEASE_GATES=NOT_CERTIFIED'
