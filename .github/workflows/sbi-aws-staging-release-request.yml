name: SBI AWS Staging Release Request
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full reviewed 40-character Git commit SHA"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sbi-aws-staging-release
  cancel-in-progress: false
jobs:
  request-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sbi-staging
    steps:
      - name: Validate release SHA and restricted deployment prerequisites
        shell: bash
        env:
          SHA: ${{ inputs.release_sha }}
          DEPLOY_HOST: ${{ secrets.SBI_STAGE_HOST }}
          DEPLOY_KEY: ${{ secrets.SBI_STAGE_DEPLOY_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.SBI_STAGE_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid SHA'; exit 2; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_KEY" && -n "$DEPLOY_HOST_KEY" ]] || { echo 'BLOCKED: restricted deployment credentials not configured'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/stage_key"
          chmod 600 "$HOME/.ssh/stage_key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          # The destination authorized_keys must force a single root-owned,
          # allowlisted staging-release request. Never execute arbitrary shell commands.
          ssh -i "$HOME/.ssh/stage_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "sbi-deployer@$DEPLOY_HOST" "deploy $SHA"
          echo 'STAGING_RELEASE_REQUEST_SENT=PASS'
