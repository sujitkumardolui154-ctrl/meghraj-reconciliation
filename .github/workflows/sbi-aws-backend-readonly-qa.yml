name: SBI AWS Read-only Backend Package QA
on:
  pull_request:
    paths:
      - backend_source/aws_readonly_reporting_app.py
      - staging/aws_backend_readonly/**
      - tests/test_sbi_aws_readonly_backend.py
      - .github/workflows/sbi-aws-backend-readonly-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal isolated test dependencies
        run: python -m pip install -r staging/aws_backend_readonly/requirements.txt
      - name: Verify fail-closed report routes and packaging
        run: python -m unittest discover -s tests -p test_sbi_aws_readonly_backend.py -v
      - name: Build isolated image (no deploy)
        run: docker build -f staging/aws_backend_readonly/Dockerfile --build-arg SBI_SOURCE_SHA="${GITHUB_SHA}" -t sbi-readonly-qa:"${GITHUB_SHA}" .
      - name: Test non-root image with no network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 -e SBI_AWS_REPORT_USERNAME=synthetic \
            -e SBI_AWS_REPORT_PASSWORD=synthetic-not-a-real-secret-long-pass \
            sbi-readonly-qa:"${GITHUB_SHA}" python -c \
            'import os; from app import app; c=app.test_client(); assert os.getuid()==10001; assert c.get("/healthz").status_code==200; assert c.get("/readyz").status_code==503; assert c.get("/reports").status_code==401; assert c.post("/reports").status_code==403; assert c.get("/api/upload").status_code==403'
      - name: Financial and production gates remain closed
        run: |
          echo 'AWS_DEPLOYMENT=NOT_ATTEMPTED'
          echo 'FINANCIAL_DATABASE=NOT_CONNECTED'
          echo 'FINANCIAL_WRITES=DISABLED'
          echo 'FIREBASE_ROLE_PROVISIONING=DRY_RUN_ONLY'
