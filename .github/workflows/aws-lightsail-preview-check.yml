name: AWS Lightsail preview safety
on:
  push:
    branches: ['aws/lightsail-preview-20261102']
  pull_request:
    paths:
      - 'staging/railway_public/**'
      - 'staging/aws_lightsail/**'
      - 'staging/aws_backend_readonly/**'
      - 'deployment/reporting_staging/**'
      - 'dashboard_source/production_gateway.py'
      - 'dashboard_source/dashboard_sessions.py'
      - 'dashboard_source/index.html'
      - 'dashboard_source/invoice_gst_ui.js'
      - 'dashboard_source/credit_note_ui.js'
      - '.github/workflows/aws-lightsail-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r staging/railway_public/requirements.txt
      - run: python -m unittest -v test_app test_priority_tasks
        working-directory: staging/railway_public
      - name: Confirm no cloud mutation
        run: |
          echo 'AWS_DEPLOYMENT=NOT_EXECUTED'
          echo 'GCP_PRODUCTION=UNCHANGED'
          echo 'FINANCIAL_DATABASE_WRITES=0'
