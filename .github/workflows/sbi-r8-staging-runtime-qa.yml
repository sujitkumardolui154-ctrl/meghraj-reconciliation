name: SBI R8 Separate Firebase Staging Startup Guards (No Cloud)
on:
  push:
    branches:
      - review/sbi-r8-staging-runtime-failclosed-20261123
  pull_request:
    branches:
      - feature/sbi-payment-reconciliation-readiness-gate-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source without writable token
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source test dependencies
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Verify 20 staging process and production-isolation guards
        run: python -m unittest discover -s tests -p 'test_sbi_r8_staging_runtime.py' -v
      - name: Retain existing nonfinancial Flask regression coverage
        run: |
          python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
          python -m unittest discover -s tests -p 'test_sbi_reconciliation_readiness.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r4_readonly_flask_http.py' -v
      - name: Ensure original production modules still contain financial deny
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'def disabled_financial_api(route)' staging/aws_login_v150/app.py
          grep -Fq '2026-11-23T00:00:00+05:30' staging/aws_login_v150/reconciliation_review_adapter.py
          grep -Fq 'id="dil-payment-reconcile" disabled' dashboard_source/index.html
          echo 'R8_STAGING_GUARDS=TESTED'
          echo 'R8_REAL_SIGNED_FIREBASE_AUTH=NOT_EXECUTED'
          echo 'R8_AWS_DEPLOYMENT=NOT_EXECUTED'
          echo 'R8_FINANCIAL_APPLY=LOCKED'

  staging-container:
    name: Isolated R8 staging Docker boot and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout read-only GitHub source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check staging Docker test script syntax
        run: bash -n scripts/ci/sbi_r8_staging_image_canary.sh
      - name: Build only the staging-specific Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f staging/aws_login_v150/Dockerfile.r8_staging \
            --build-arg SBI_SOURCE_SHA="$GITHUB_SHA" \
            -t "sbi-r8-staging:$GITHUB_SHA" .
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "sbi-r8-staging:$GITHUB_SHA")" = "$GITHUB_SHA"
          echo 'R8_STAGING_SOURCE_IMAGE=PASS'
      - name: Fail-closed image boot, isolated smoke test, cleanup
        shell: bash
        env:
          R8_STAGING_IMAGE: sbi-r8-staging:${{ github.sha }}
          R8_STAGING_SHA: ${{ github.sha }}
        run: bash scripts/ci/sbi_r8_staging_image_canary.sh
      - name: Ensure no R8 canary container survived
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker ps -a --filter 'name=^/sbi-r8-ci-' --format '{{.Names}}' | grep -q .; then
            echo 'R8_STAGING_POSTRUN_CLEANUP=FAIL'
            exit 1
          fi
          echo 'R8_STAGING_POSTRUN_CLEANUP=PASS'
