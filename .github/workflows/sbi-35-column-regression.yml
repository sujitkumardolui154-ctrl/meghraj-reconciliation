name: SBI Approved 35-Column Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend_source/invoice_source_schema.py'
      - 'backend_source/invoice_import_contract.json'
      - 'backend_source/invoice_excel_parser.py'
      - 'backend_source/credit_note_53_adapter.py'
      - 'tests/test_approved_35_source_layout.py'
      - 'tests/test_approved_35_excel_parser.py'
      - '.github/workflows/sbi-35-column-regression.yml'
  push:
    branches: [feature/sbi-approved-35-column-adapter-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-35-column-import-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Excel-test dependencies
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4' 'xlrd>=2,<3' 'xlwt>=1.3,<2'
      - name: Validate source schema, mapping, and XLSX/XLS parser (synthetic only)
        run: python -m unittest discover -s tests -p 'test_approved_35_*.py' -v
      - name: Confirm safe no-deployment test
        run: echo 'FINANCIAL_EXECUTION=RESTRICTED; DATABASE_WRITES=0; DEPLOYMENT=NOT_REQUESTED'
