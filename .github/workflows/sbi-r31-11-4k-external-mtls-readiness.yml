name: SBI R31.11.4K external mTLS approval and release-gate QA (offline)
on:
  push:
    branches: [feature/sbi-r31-11-4k-external-mtls-deployment-readiness-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-deploy-approval-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only test imports; never authenticate AWS/Firebase
        run: python -m pip install --disable-pip-version-check 'Flask>=3,<4' 'firebase-admin>=6,<8' 'cryptography>=43,<49'
      - name: Compile and run offline manifest release-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile staging/aws_login_v150/r31_11_4k_external_mtls_readiness.py
          python -B -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_4k_*.py' -v
          python -B -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_4j_combined_gate.py' -v
      - name: Review-only Caddy and no release-toggle static protections
        shell: bash
        run: |
          set -euo pipefail
          A=staging/aws_login_v150/r31_11_4k_external_mtls_approval_packet.json
          C=staging/aws_login_v150/Caddyfile.r31_11_4k_NOT_FOR_DEPLOYMENT.template
          P=staging/aws_login_v150/r31_11_4k_external_mtls_readiness.py
          python -m json.tool "$A" >/dev/null
          grep -Fq 'DO NOT IMPORT OR DEPLOY' "$C"
          grep -Fq 'respond "QA ROUTE NOT APPROVED" 503' "$C"
          ! grep -Eq 'reverse_proxy|file_server' "$C"
          grep -Fq 'DB_R31_11_4K_EXTERNAL_HTTPS_MTLS=NOT_TESTED' "$P"
          grep -Fq 'DB_R31_11_4K_FINANCIAL_APPLY=LOCKED' "$P"
          grep -Fq 'DB_R31_11_4K_PRODUCTION_RELEASE=BLOCKED' "$P"
          ! grep -En 'FINANCIAL_APPLY=ENABLED|CREATE ROLE|DROP DATABASE|docker.*--publish|CADDY_CONFIG_WRITE_ENABLED' "$P"
