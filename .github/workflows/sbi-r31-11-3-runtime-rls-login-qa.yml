name: DB-R31.11.3 Restricted Login Runtime RLS Integration QA
on:
  push:
    branches:
      - feature/sbi-r31-11-3-runtime-rls-adapter-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-runtime-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sbi_r31_11_tenant_clone_20261125
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-r3113-admin-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-r3113-admin-disposable-only
      PGDATABASE: sbi_r31_11_tenant_clone_20261125
      R3113_DISPOSABLE_POSTGRES_CI: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'Flask>=3,<4'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Create disposable R31 schema and RLS policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE sbi_r31_ownerqa_report NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_ci_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_clone_rls_up.sql
          psql -X -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_clone_rls_verify.sql
      - name: Provision disposable password-authenticated restrictive logins
        run: psql -X -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_3_ci_disposable_login_provision.sql
      - name: Run minimal runtime source adapter regression
        run: |
          python -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_3_runtime_rls_adapter.py' -v
          python -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_3_runtime_rls_blueprint.py' -v
          python -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_3_real_postgres_login.py' -v
      - name: Confirm production database absent from synthetic service
        run: |
          test "$(psql -X -qAt -c "SELECT count(*) FROM pg_database WHERE datname='sbi_reconciliation_main'")" = 0
          test "$(psql -X -qAt -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('r311_qa_tenant_a','r311_qa_tenant_b') AND NOT rolcanlogin AND NOT rolbypassrls")" = 2
