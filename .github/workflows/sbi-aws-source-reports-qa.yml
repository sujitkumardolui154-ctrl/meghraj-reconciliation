name: SBI AWS Source-only Report Connectivity QA
on:
  push:
    branches: [feature/sbi-aws-readonly-reports-source-gate-20261120]
  pull_request:
    branches: [feature/sbi-payment-reconciliation-readiness-gate-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sbi-readonly-source-report-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated Firebase and Excel dependencies
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Source-backed four-report and CSV safety regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_readonly_reports_gateway.py' -v
      - name: Payment evidence receipt regression
        run: python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
      - name: Reconciliation source readiness gate regression
        run: python -m unittest discover -s tests -p 'test_sbi_reconciliation_readiness.py' -v
      - name: Firebase access and financial-denial regression
        run: python -m unittest discover -s tests -p 'test_sbi_aws_login_v150.py' -v
      - name: Isolated Docker candidate build (no AWS connectivity)
        run: docker build -f staging/aws_login_v150/Dockerfile --build-arg SBI_SOURCE_SHA="$GITHUB_SHA" -t sbi-readonly-reports-qa:local .
      - name: Disconnected unauthenticated HTTP and finance denials
        run: |
          docker run -d --name sbi-readonly-reports-qa --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges sbi-readonly-reports-qa:local
          for i in $(seq 1 20); do
            if docker exec sbi-readonly-reports-qa python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)" >/dev/null 2>&1;then break;fi
            sleep 1
          done
          docker exec -i sbi-readonly-reports-qa python - <<'PY'
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError
          def code(path,method="GET"):
              try: return urlopen(Request("http://127.0.0.1:8080"+path,method=method),timeout=5).status
              except HTTPError as e:return e.code
          assert code('/healthz')==200
          assert code('/login')==200
          assert code('/api/reporting/v2')==401
          assert code('/api/reporting/v2/unpaid.csv')==401
          assert code('/api/reports')==401
          assert code('/api/payment-reconciliation/run','POST')==403
          print("READONLY_REPORTS_NETWORK_DISCONNECTED=PASS")
          PY
      - name: Remove candidate
        if: always()
        run: docker rm -f sbi-readonly-reports-qa 2>/dev/null || true
