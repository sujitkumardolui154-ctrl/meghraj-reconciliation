name: SBI DB R31 Owner-SHA Persistent Migration (DISPOSABLE CI ONLY)
on:
  push:
    branches:
      - integration/sbi-db-r31-persistent-owner-ci-20261125
  pull_request:
    branches:
      - sbi-central-postgresql-main-20261121
permissions:
  contents: read
jobs:
  disposable-owner-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify narrow disposable-only schema migration sources
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          prefix='database/stage31/db_r31_owner_persistent_ci_'
          for kind in ('up','down','test','cleanup'):
              c=Path(prefix+kind+'.sql').read_text()
              assert "sbi_ft04g_clean_0e858f93" in c
              assert "sbi_r31.disposable_ci" in c
              assert "DB_R31_PRODUCTION_DATABASE_PRESENT" in c or (
                  "datname='sbi_reconciliation_main'" in c)
              assert "verified-disposable-container" in c
              assert "BEGIN;" in c and "COMMIT;" in c
              if kind in ('up','down'):
                  assert "DELETE FROM" not in c
                  assert "INSERT INTO" not in c
          assert "CREATE UNIQUE INDEX ux_r31_ci_owned_source_sha" in Path(prefix+'up.sql').read_text()
          assert "DB_R31_OWNER_DUPLICATES_PREVENT_GLOBAL_ROLLBACK" in Path(prefix+'down.sql').read_text()
          assert "ROLLBACK;" in Path('database/stage31/db_r31_owner_scope_qa_tx.sql').read_text()
          print("DB_R31_DISPOSABLE_QA_SCOPE_AUDIT=PASS")
          PY
      - name: Create isolated Postgres 16 with NO published ports, networks, production DB
        run: |
          set -Eeuo pipefail
          docker run --detach --name sbi-r31-persistent-ci-only \
            --network none \
            -e POSTGRES_DB=sbi_ft04g_clean_0e858f93 \
            -e POSTGRES_PASSWORD=SYNTHETIC_CI_ONLY_PASS_20261125 \
            postgres:16-alpine
          ready=0
          for i in $(seq 1 60); do
            if docker exec sbi-r31-persistent-ci-only \
              pg_isready -h 127.0.0.1 -U postgres \
                -d sbi_ft04g_clean_0e858f93 >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo 'DB_R31_DISPOSABLE_POSTGRES_UNAVAILABLE'
            docker logs sbi-r31-persistent-ci-only | tail -n 30
            exit 1
          fi
          docker inspect sbi-r31-persistent-ci-only | python -c '
          import json,sys
          d=json.load(sys.stdin)[0]
          assert d["HostConfig"]["NetworkMode"]=="none"
          assert not d["HostConfig"].get("PortBindings")
          print("DB_R31_DISPOSABLE_NO_NETWORK_NO_PORTS=PASS")'
          docker exec sbi-r31-persistent-ci-only \
            psql -qAt -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c \
            "SELECT datname FROM pg_database WHERE datname='sbi_reconciliation_main'" |
              (! grep -q .)
          echo 'DB_R31_PRODUCTION_DB_IN_CI=ABSENT'
      - name: Add ONLY FT04 synthetic source schema and existing QA R31 source view
        run: |
          set -Eeuo pipefail
          for path in \
            database/stage31/db_r31_ft04_qa_seed.sql \
            database/stage31/db_r31_additive_qa_up.sql; do
            docker exec -i sbi-r31-persistent-ci-only \
              psql -X -qAt -v ON_ERROR_STOP=1 -U postgres \
              -d sbi_ft04g_clean_0e858f93 < "$path"
          done
          echo 'DB_R31_DISPOSABLE_BASE_SCHEMA=PASS'
      - name: Apply persistent owner-scope schema to DISPOSABLE clone only
        run: |
          set -Eeuo pipefail
          docker exec -i \
            -e PGOPTIONS='-c sbi_r31.disposable_ci=verified-disposable-container' \
            sbi-r31-persistent-ci-only psql -X -qAt -v ON_ERROR_STOP=1 \
            -U postgres -d sbi_ft04g_clean_0e858f93 \
            < database/stage31/db_r31_owner_persistent_ci_up.sql
          docker exec sbi-r31-persistent-ci-only psql -X -qAt \
            -v ON_ERROR_STOP=1 -U postgres -d sbi_ft04g_clean_0e858f93 -c \
            "SELECT
             (SELECT count(*) FROM pg_indexes WHERE schemaname='sbi' AND
               indexname IN ('ux_r31_ci_owned_source_sha','ux_r31_ci_legacy_source_sha'))::text
             ||'|'||
             (SELECT count(*) FROM pg_constraint WHERE
               conrelid='sbi.import_batches'::regclass AND contype='u'
               AND pg_get_constraintdef(oid) LIKE
                 'UNIQUE (source_system, source_kind, source_sha256)%')::text" |
            grep -Fx '2|0'
          echo 'DB_R31_OWNER_PERSISTENT_SCHEMA_QA=PASS'
      - name: Two owners same SHA persist, same owner and unowned refused
        run: |
          set -Eeuo pipefail
          docker exec -i \
            -e PGOPTIONS='-c sbi_r31.disposable_ci=verified-disposable-container' \
            sbi-r31-persistent-ci-only psql -X -qAt -v ON_ERROR_STOP=1 \
            -U postgres -d sbi_ft04g_clean_0e858f93 \
            < database/stage31/db_r31_owner_persistent_ci_test.sql
          count="$(docker exec sbi-r31-persistent-ci-only \
            psql -qAt -X -U postgres -d sbi_ft04g_clean_0e858f93 \
            -c "SELECT count(*) FROM sbi.import_batches WHERE source_sha256=repeat('a',64)")"
          [[ "$count" == 2 ]]
          echo 'DB_R31_OWNER_SCOPED_TWO_OWNER_EVIDENCE_PERSISTED=PASS'
      - name: Rollback MUST refuse while duplicate global SHA rows exist
        run: |
          set -Eeuo pipefail
          if docker exec -i \
            -e PGOPTIONS='-c sbi_r31.disposable_ci=verified-disposable-container' \
            sbi-r31-persistent-ci-only psql -X -qAt -v ON_ERROR_STOP=1 \
            -U postgres -d sbi_ft04g_clean_0e858f93 \
            < database/stage31/db_r31_owner_persistent_ci_down.sql \
            > "$RUNNER_TEMP/r31-rollback-negative.log" 2>&1; then
            echo 'DB_R31_ROLLBACK_ACCEPTED_OWNER_SHA_COLLISION_UNSAFE'
            exit 1
          fi
          grep -F 'DB_R31_OWNER_DUPLICATES_PREVENT_GLOBAL_ROLLBACK' \
            "$RUNNER_TEMP/r31-rollback-negative.log" >/dev/null
          echo 'DB_R31_ROLLBACK_WITH_OWNER_COLLISION=CORRECTLY_REFUSED'
      - name: Discard synthetic-only receipts then restore original schema in CI
        run: |
          set -Eeuo pipefail
          for path in \
            database/stage31/db_r31_owner_persistent_ci_cleanup.sql \
            database/stage31/db_r31_owner_persistent_ci_down.sql; do
            docker exec -i \
              -e PGOPTIONS='-c sbi_r31.disposable_ci=verified-disposable-container' \
              sbi-r31-persistent-ci-only psql -X -qAt -v ON_ERROR_STOP=1 \
              -U postgres -d sbi_ft04g_clean_0e858f93 < "$path"
          done
          docker exec sbi-r31-persistent-ci-only \
            psql -qAt -X -U postgres -d sbi_ft04g_clean_0e858f93 -c \
            "SELECT
             (SELECT count(*) FROM sbi.import_batches)::text ||'|'||
             (SELECT count(*) FROM pg_constraint WHERE
               conrelid='sbi.import_batches'::regclass AND contype='u'
               AND pg_get_constraintdef(oid) LIKE
                 'UNIQUE (source_system, source_kind, source_sha256)%')::text
             ||'|'||
             (SELECT count(*) FROM pg_indexes WHERE schemaname='sbi' AND
               indexname IN ('ux_r31_ci_owned_source_sha','ux_r31_ci_legacy_source_sha'))::text" |
            grep -Fx '0|1|0'
          echo 'DB_R31_OWNER_QA_ROLLBACK_SCHEMA_AND_ROWS=PASS'
          echo 'DB_R31_AWS_HOST_DEPLOYMENT=NONE'
          echo 'DB_R31_PRODUCTION_FINANCIAL_WRITES=NONE'
      - name: Dispose isolated PostgreSQL regardless of result
        if: always()
        run: |
          docker rm -f sbi-r31-persistent-ci-only >/dev/null 2>&1 || true
          echo 'DB_R31_DISPOSABLE_POSTGRES_DESTROYED=YES'
