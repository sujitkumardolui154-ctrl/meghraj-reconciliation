name: SBI Consolidated Agent Controller
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: sbi-agent-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  task-and-qa-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting test requirements
        run: python -m pip install -r dashboard_source/requirements.txt
      - name: Validate agent controller
        run: python -m unittest discover -s tests -p test_consolidated_controller.py -v
      - name: Verify manual correction queue coverage and no-write gates
        run: |
          python -m unittest discover -s tests -p test_sbi_manual_correction_audit.py -v
          python tools/sbi_manual_correction_audit.py
      - name: Verify offline approved CSV report bundling
        run: python -m unittest discover -s tests -p test_sbi_approved_report_bundle.py -v
      - name: Validate A-workstream CREDIT NOTE narration and change-report contracts
        run: |
          python -m unittest discover -s tests -p test_sbi_credit_note_narration_contract.py -v
          python -m unittest discover -s tests -p test_sbi_reconciliation_changes_offline.py -v
      - name: Verify A03 exact source header and A06 original positional report projection
        run: |
          python -m unittest discover -s tests -p test_sbi_credit_note_53_projection.py -v
          python -m unittest discover -s tests -p test_sbi_report_headers_audit.py -v
      - name: Verify A01 report authorization and A02 payment classification
        run: |
          python -m unittest discover -s tests -p test_sbi_a01_report_access.py -v
          python -m unittest discover -s tests -p test_sbi_a02_payment_classification.py -v
      - name: Verify A02 Suspense status and A08 53-column financial report parity
        run: |
          python -m unittest discover -s tests -p test_sbi_suspense_report_contract.py -v
          python -m unittest discover -s tests -p test_sbi_financial_report_parity.py -v
      - name: Verify reporting role provisioning and signed-in E2E safety
        run: |
          python -m unittest discover -s tests -p test_sbi_reporting_role_provision.py -v
          python -m unittest discover -s tests -p test_sbi_reporting_signed_in_e2e.py -v
      - name: Run consolidated safety contract tests
        run: python agent/consolidated_controller.py --run-tests --full-tests --output /tmp/sbi-agentic-gate.json
      - name: Publish auditable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbi-agentic-gate
          path: /tmp/sbi-agentic-gate.json
          if-no-files-found: warn
      - name: Financial release remains restricted
        run: |
          echo 'AUTONOMOUS_CODING=NOT_CONFIGURED'
          echo 'FINANCIAL_WRITES=DISABLED'
          echo 'TRAFFIC_PROMOTION=DISABLED'
