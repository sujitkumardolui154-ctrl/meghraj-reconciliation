name: G AWS UI Preview QA

on:
  pull_request:
    paths:
      - "staging/railway_public/**"
      - "dashboard_source/login*"
      - "dashboard_source/dashboard_sessions.py"
      - "tests/test_g_*"
      - "tools/g_aws_ui_preview_readonly_attest.sh"
      - "tools/g_aws_ui_preview_readonly_attest.py"
      - ".github/workflows/g-aws-ui-preview-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated preview dependencies
        run: python -m pip install -r staging/railway_public/requirements.txt
      - name: Source contracts
        run: python -m unittest discover -s tests -p 'test_g_login_aws_merge_contract.py' -v && python -m unittest discover -s tests -p 'test_g_aws_ui_preview.py' -v
      - name: Flask auth gate regression
        run: python -m unittest discover -s tests -p 'test_g_aws_ui_preview_http.py' -v
      - name: Live attestor syntax only (no cloud requests)
        run: bash -n tools/g_aws_ui_preview_readonly_attest.sh
      - name: Python syntax
        run: python -m py_compile staging/railway_public/app.py tests/test_g_*.py tools/g_aws_ui_preview_readonly_attest.py
