name: SBI R18 Financial Source Certification and XLSX Parity (Synthetic Only)
on:
  push:
    branches:
      - review/sbi-r18-v251-source-certification-output-parity-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r18-private-financial-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX structural reader only
        run: python -m pip install 'openpyxl>=3.1.5,<4'
      - name: Check source audit syntax and isolated R15 R16 R17 R18 combined QA
        env:
          SBI_FINANCIAL_APPLY: LOCKED
          CI: 'true'
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_AUTH_EMULATOR_HOST:-}"
          python -m py_compile scripts/ci/sbi_r18_output_parity_gate.py
          python -m unittest discover -s tests -p 'test_sbi_r15_financial_source_preflight.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r16_master_identity_shadow.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r17_synthetic_financial_shadow.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r18_output_parity_gate.py' -v
          echo 'R18_SYNTHETIC_V218_STRUCTURE_AND_SOURCE_AUDIT=PASS'
          echo 'R18_APPROVED_V251_MATRIX_V239_SOURCE=NOT_VERIFIED'
          echo 'R18_V218_WRITER_FINANCIAL_AMOUNT_PARITY=NOT_EXECUTED'
          echo 'R18_REAL_BANK_SOURCE=NOT_IMPORTED'
          echo 'R18_POSTGRESQL_AND_AWS=NOT_CONNECTED'
          echo 'R18_REAL_FIREBASE_APP_SESSION=NOT_VERIFIED'
          echo 'R18_FINANCIAL_APPLY=LOCKED'
