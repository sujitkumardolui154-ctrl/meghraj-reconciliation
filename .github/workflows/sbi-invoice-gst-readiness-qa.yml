name: SBI Invoice GST Combined Readiness (targeted offline only)
on:
  pull_request:
    paths:
      - 'scripts/sbi_invoice_gst_combined_readiness.py'
      - 'tests/test_invoice_gst_combined_readiness.py'
      - '.github/workflows/sbi-invoice-gst-readiness-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-readiness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Targeted offline gate and no-write regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_invoice_gst_combined_readiness.py' -v
          python -m py_compile scripts/sbi_invoice_gst_combined_readiness.py
          echo 'INV_GST_COMBINED_READINESS_QA=PASS_OFFLINE_ONLY'
          echo 'AUTHENTICATED_AWS_E2E=NOT_TESTED'
          echo 'FINANCIAL_APPLY=LOCKED'
          echo 'PRODUCTION_DEPLOYMENT=BLOCKED'
