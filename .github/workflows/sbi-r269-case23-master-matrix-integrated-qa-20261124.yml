          from sbi_r26_independent_financial_oracle import Invoice,Payment
          from sbi_r262_rebuild_candidate_planner import fixture_digest
          from sbi_r263_global_allocation_shadow import Proposal,GlobalGate,proposal_digest
          from sbi_r264_financial_accounting_shadow import SyntheticTDS,accounting_digest
          from sbi_r265_independent_parity_gate import verify_synthetic_parity,release_gate_matrix
          inv=[Invoice("SYN-MXP-001","0001","SYNTHETIC ALPHA",
              "1000.00","90.00","90.00","1180.00","1180.00",
              date(2026,9,1),("2026-09",))]
          pay=[Payment("SYN-PAY-001","0001","SYNTHETIC ALPHA",
              "1160.00",date(2026,9,15),("2026-09",),("SYN-MXP-001",))]
          master=[("0001","SYNTHETIC ALPHA")]
          plan=[Proposal("SYN-PAY-001","SYN-MXP-001","1160.00"),GlobalGate()]
          evid=[SyntheticTDS("SYN-TDS-001","SYN-PAY-001","SYN-MXP-001",2,"20.00")]
          result=verify_synthetic_parity(
              inv,pay,master,plan,tds_evidence=evid,
              expected_fixture_sha256=fixture_digest(inv,pay,master),
              expected_plan_sha256=proposal_digest(plan,()),
              expected_accounting_sha256=accounting_digest(evid,()),
          )
          assert result["decision"]=="PASS_SYNTHETIC_ARITHMETIC_ONLY"
          assert result["independent_arithmetic_pass"]
          assert not result["real_financial_rows_used"]
          assert not result["full_v251_certified"]
          assert result["financial_apply_locked"]
