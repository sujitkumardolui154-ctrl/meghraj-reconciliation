name: SBI R26.9 Case 2.3 Integrated Master Matrix Method QA (Finance Locked)
on:
  push:
    branches:
      - review/sbi-r269-case23-master-matrix-integrated-adjudication-20261124
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r269-case23-integrated-master-matrix-finance-locked:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sbi_r20_synthetic_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sbi_r20_synthetic_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      SBI_FINANCIAL_APPLY: LOCKED
      SBI_R20_DISPOSABLE_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/sbi_r20_synthetic_qa
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Excel parser and PostgreSQL client for isolated tests
        run: python -m pip install 'openpyxl>=3.1.5,<4' 'psycopg[binary]>=3.2,<4'
      - name: Run all existing R15-R19 source, SOL, finance-shadow and XLSX tests
        run: |
          set -Eeuo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_AUTH_EMULATOR_HOST:-}"
          python -m unittest discover -s tests -p 'test_sbi_r15_financial_source_preflight.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r16_master_identity_shadow.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r17_synthetic_financial_shadow.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r18_output_parity_gate.py' -v
          python -m unittest discover -s tests -p 'test_sbi_r19_combined_synthetic_rehearsal.py' -v
      - name: R24 enforce original invoice J and monetary K:N positions
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("scripts/ci").resolve()))
          from sbi_r16_master_identity_shadow import EXPECTED_INVOICE_HEADERS
          from sbi_r19_combined_synthetic_rehearsal import EXPECTED_INVOICE_FIELDS, build_synthetic_fixture
          from openpyxl import load_workbook
          import io
          assert EXPECTED_INVOICE_HEADERS[10]=="Invoice No"
          assert EXPECTED_INVOICE_HEADERS[13]=="SGST"
          assert EXPECTED_INVOICE_FIELDS[10]=="Invoice No"
          assert EXPECTED_INVOICE_FIELDS[11]=="Taxable Amount"
          assert EXPECTED_INVOICE_FIELDS[12]=="CGST"
          assert EXPECTED_INVOICE_FIELDS[13]=="SGST"
          assert EXPECTED_INVOICE_FIELDS[14]=="Total Bill Amount"
          source,_=build_synthetic_fixture()
          wb=load_workbook(io.BytesIO(source),read_only=True,data_only=False)
          try:
              inv=wb["Invoice Details."]
              assert inv["J1"].value=="Invoice No"
              assert inv["K1"].value=="Taxable Amount"
              assert inv["L1"].value=="CGST"
              assert inv["M1"].value=="SGST"
              assert inv["N1"].value=="Total Bill Amount"
              assert inv["J2"].value=="SYN-MXP-001"
              assert inv["M2"].value==90
              assert inv["N2"].value==1180
          finally:
              wb.close()
          print("R24_APPROVED_ORIGINAL_INVOICE_J_THROUGH_N=PASS")
          print("R24_SOURCE_DATA_MOVED=NO")
          print("R24_REAL_SBI_DATA_EXECUTED=NO")
          print("R24_FINANCIAL_APPLY=LOCKED")
          PY
      - name: R25 SOL authority, padding collision and source-type synthetic-only unit tests
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r25_sol_identity_review.py tests/test_sbi_r25_sol_identity_review.py
          python -m unittest discover -s tests -p 'test_sbi_r25_sol_identity_review.py' -v
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("scripts/ci").resolve()))
          from sbi_r25_sol_identity_review import review_identity
          r=review_identity("2","SYNTHETIC BETA",(("0002","SYNTHETIC BETA"),))
          assert r["status"]=="UNIQUE_PADDED_SOL_OFFICIAL_NAME_REVIEW_ONLY"
          assert r["source_sol_preserved"]=="2"
          assert r["candidate_master_sol"]=="0002"
          assert not r["formal_master_authority_verified"]
          assert not r["payment_allocation_executed"]
          assert r["financial_apply_locked"]
          print("R25_SOL_PADDED_IDENTITY=REVIEW_ONLY")
          print("R25_REAL_BANK_SOURCE_OR_SOL_MASTER=NOT_UPLOADED_TO_GITHUB")
          print("R25_PRODUCTION_DATABASE_WRITES=NONE")
          print("R25_FINANCIAL_APPLY=LOCKED")
          PY
      - name: R26 independent hypothetical finance ledger and TDS oracle (SYNTHETIC ONLY)
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r26_independent_financial_oracle.py tests/test_sbi_r26_independent_financial_oracle.py
          python -m unittest discover -s tests -p 'test_sbi_r26_independent_financial_oracle.py' -v
          mkdir -p r20-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path("scripts/ci").resolve()))
          from sbi_r26_independent_financial_oracle import release_readiness
          report=release_readiness()
          assert report["stage"]=="R26_PARTIAL_INDEPENDENT_FINANCIAL_ORACLE"
          assert not report["complete_master_v251_executable_certified"]
          assert not report["matrix_v239_method_parity_certified"]
          assert not report["real_financial_source_ledger_oracle_passed"]
          assert not report["actual_v218_financial_writer_parity_passed"]
          assert not report["real_staging_auth_and_database_passed"]
          assert not report["finance_security_production_signoff"]
          assert report["real_financial_allocation_count"]==0
          assert report["financial_apply_locked"]
          assert not report["production_release_authorized"]
          Path("r20-artifacts/r26_synthetic_oracle_release_lock.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\\n")
          print("R26_INDEPENDENT_SYNTHETIC_FINANCIAL_ORACLE=SCOPED_QA_ONLY")
          print("R26_FULL_V251_V239_CERTIFICATION=BLOCKED_EXTERNAL_EVIDENCE")
          print("R26_REAL_BANK_DATA_USED=NO")
          print("R26_PRODUCTION_DB_WRITES=NONE")
          print("R26_FINANCIAL_APPLY=LOCKED")
          PY
      - name: R26.2 synthetic-only rebuilt candidate planner / no source ingestion
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r262_rebuild_candidate_planner.py tests/test_sbi_r262_rebuild_candidate_planner.py
          python -m unittest discover -s tests -p 'test_sbi_r262_rebuild_candidate_planner.py' -v
          mkdir -p r20-artifacts
          python - <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,str(Path("scripts/ci").resolve()))
          from sbi_r26_independent_financial_oracle import Invoice, Payment
          from sbi_r262_rebuild_candidate_planner import fixture_digest, plan_synthetic_only
          invoice=Invoice("SYN-MXP-001","0001","SYNTHETIC ALPHA","1000.00","90.00",
                          "90.00","1180.00","1180.00",date(2026,9,1),("2026-09",))
          payment=Payment("SYN-PAY-001","0001","SYNTHETIC ALPHA","1160.00",
                          date(2026,9,15),("2026-09",),("SYN-MXP-001",))
          master=(("0001","SYNTHETIC ALPHA"),)
          source=[invoice]
          bank=[payment]
          result=plan_synthetic_only(source,bank,master,expected_fixture_sha256=
                                      fixture_digest(source,bank,master))
          assert result["stage"]=="R262_V251_REBUILD_CANDIDATE_NOT_CERTIFIED"
          assert result["financial_apply_locked"]
          assert result["real_financial_allocations"]==0
          assert result["production_database_writes"]==0
          assert not result["complete_v251_v239_certified"]
          assert not result["production_release_authorized"]
          assert result["partial_waterfall_implemented"] is False
          assert result["financial_status"] is None
          receipt={
              "stage":result["stage"], "scope":"synthetic candidate edges only",
              "test_candidate_count":len(result["review_candidate_edges"]),
              "real_sbi_data_used":False, "oct27_master_owner_selection_recorded":True,
              "master_private_file_uploaded_to_github":False,
              "excluded_149_owner_rows_changed":False,
              "full_engine_v251_v239_certified":False,
              "financial_apply_locked":True, "production_writes":0,
          }
          Path("r20-artifacts/r262_scoped_rebuild_manifest.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("R262_SYNTHETIC_REBUILD_CANDIDATE=PASS_SCOPED_ONLY")
          print("R262_USER_OCT27_MASTER_PIN=DOCUMENTED_REVIEW_ONLY")
          print("R262_EXCLUDED_149_ROW_CHANGES=NONE")
          print("R262_REAL_DATA_IMPORT=NOT_EXECUTED")
          print("R262_FULL_V251_V239_CERTIFICATION=BLOCKED")
          print("R262_FINANCIAL_APPLY=LOCKED")
          PY
      - name: R26.3 atomic shadow ledger, partial receipts, GST/SBISA and waterfall-last tests
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r263_global_allocation_shadow.py tests/test_sbi_r263_global_allocation_shadow.py
          python -m unittest discover -s tests -p 'test_sbi_r263_global_allocation_shadow.py' -v
          mkdir -p r20-artifacts
          python - <<'PY'
          import json,sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,str(Path("scripts/ci").resolve()))
          from sbi_r26_independent_financial_oracle import Invoice,Payment
          from sbi_r262_rebuild_candidate_planner import fixture_digest
          from sbi_r263_global_allocation_shadow import (
              shadow_adjudicate,proposal_digest,Proposal,GlobalGate,
          )
          inv=[Invoice("SYN-MXP-001","0001","SYNTHETIC ALPHA",
                 "1000.00","90.00","90.00","1180.00","1180.00",
                 date(2026,9,1),("2026-09",))]
          pay=[Payment("SYN-PAY-001","0001","SYNTHETIC ALPHA",
                 "1160.00",date(2026,9,15),("2026-09",),("SYN-MXP-001",))]
          master=[("0001","SYNTHETIC ALPHA")]
          steps=[Proposal("SYN-PAY-001","SYN-MXP-001","1160.00"),GlobalGate()]
          result=shadow_adjudicate(
              inv,pay,master,steps,
              expected_fixture_sha256=fixture_digest(inv,pay,master),
              expected_plan_sha256=proposal_digest(steps,()),
          )
          assert result["stage"]=="R263_SYNTHETIC_GLOBAL_LEDGER_WATERFALL_ONLY"
          assert result["atomic_shadow_review_pass"]
          assert result["shadow_credit_balance"]==(("SYN-PAY-001","0.00"),)
          assert result["tds_withheld_not_recognized_as_cash_or_invoice_settlement"]
          assert result["shadow_invoice_cash_coverage_gap"]==(("SYN-MXP-001","20.00"),)
          assert result["financial_status"] is None
          assert result["real_bank_payments_allocated"]==0
          assert result["real_invoice_status_updates"]==0
          assert result["real_database_writes"]==0
          assert result["financial_apply_locked"]
          assert not result["complete_master_v251_matrix_v239_certified"]
          assert not result["production_release_authorized"]
          evidence={
              "stage":result["stage"],
              "fixture_only":True,"real_bank_data_used":False,
              "invoice_cash_gap_not_settlement":True,
              "oct27_master_owner_selection_unchanged":True,
              "excluded_149_source_rows_unchanged":True,
              "complete_v251_v239_certified":False,
              "financial_apply_locked":True,"production_writes":0,
          }
          Path("r20-artifacts/r263_global_ledger_synthetic_receipt.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True)+"\n"
          )
          print("R263_ATOMIC_FULL_PARTIAL_WATERFALL_SHADOW=SCOPED_PASS")
          print("R263_GST_SBISA_CROSS_SOL_REAL_APPROVAL=NOT_VERIFIED")
          print("R263_PRIVATE_SBI_SOURCE_USED=NO")
          print("R263_REAL_DATABASE_WRITES=NONE")
          print("R263_FINANCIAL_APPLY=LOCKED")
          PY
      - name: R26.4 TDS ROUND_HALF_UP, GST, credit-note accounting and writer parity (synthetic only)
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r264_financial_accounting_shadow.py tests/test_sbi_r264_financial_accounting_shadow.py
          python -m unittest discover -s tests -p 'test_sbi_r264_financial_accounting_shadow.py' -v
