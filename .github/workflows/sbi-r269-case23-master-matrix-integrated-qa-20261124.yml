          assert not r["real_v218_financial_writer_amount_parity_verified"]
          assert not r["real_53_column_report_financial_parity_verified"]
          assert r["financial_status"] is None
          assert r["real_bank_payments_allocated"]==0
          assert r["real_financial_database_writes"]==0
