          inv=[Invoice("SYN-MXP-001","0001","SYNTHETIC ALPHA",
                 "1000.00","90.00","90.00","1180.00","1180.00",
                 date(2026,9,1),("2026-09",))]
          pay=[Payment("SYN-PAY-001","0001","SYNTHETIC ALPHA",
                 "1160.00",date(2026,9,15),("2026-09",),("SYN-MXP-001",))]
          master=[("0001","SYNTHETIC ALPHA")]
          plan=[Proposal("SYN-PAY-001","SYN-MXP-001","1160.00"),GlobalGate()]
          evid=[SyntheticTDS("SYN-TDS-001","SYN-PAY-001","SYN-MXP-001",2,"20.00")]
          r=account_synthetic_only(
              inv,pay,master,plan,tds_evidence=evid,
