      - name: R26.5 independent accounting arithmetic witness, forged-output detection and external release lock
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ci/sbi_r265_independent_parity_gate.py tests/test_sbi_r265_independent_parity_gate.py
          python -m unittest discover -s tests -p 'test_sbi_r265_independent_parity_gate.py' -v
          mkdir -p r20-artifacts
          python - <<'PY'
          import json,sys
          from datetime import date
          from pathlib import Path
