name: SBI D-031 Synthetic Receipt Registry & Cutoff Safety QA
on:
  pull_request:
    paths:
      - "staging/aws_login_v150/d031_synthetic_receipt_register.py"
      - "staging/aws_login_v150/d030_future_payment_provenance.py"
      - "tests/test_d031_synthetic_receipt_register.py"
      - "tests/test_d030_future_payment_provenance.py"
      - "docs/SBI_D031_SYNTHETIC_RECEIPT_REGISTER.md"
      - ".github/workflows/sbi-d031-synthetic-receipt-registry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-receipt-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: D-031 fake-only cutoff, concurrent UTR replay, dual-control and atomic register QA
        run: python -m unittest discover -s tests -p 'test_d031_synthetic_receipt_register.py' -v
      - name: D-030 in-memory provenance negative tests
        run: python -m unittest discover -s tests -p 'test_d030_future_payment_provenance.py' -v
      - name: Install existing nonfinancial application QA dependencies
        run: python -m pip install -r staging/aws_login_v150/requirements.txt
      - name: Existing Firebase/upload and locked reconciliation source regressions
        run: |
          python -m unittest discover -s tests -p 'test_sbi_payment_evidence_upload.py' -v
          python -m unittest discover -s tests -p 'test_sbi_reconciliation_readiness.py' -v
          python -m unittest discover -s tests -p 'test_d029_finance_unlock_requirements.py' -v
      - name: Block finance release and historical financial access
        run: |
          echo "D031_MOCK_REGISTRY=MEMORY_ONLY"
          echo "D031_CUTOFF=TEST_RUNTIME_ONLY"
          echo "D031_ROLE_ENFORCEMENT=FAKE_ONLY"
          echo "D031_REFERENCES=FAKE_UTR_ONLY"
          echo "D031_REAL_BANK_AUTHENTICATION=NOT_IMPLEMENTED"
          echo "D031_HISTORICAL_FINANCE=NOT_ACCESSED"
          echo "D031_FINANCIAL_WRITES=NOT_PERFORMED"
          echo "D031_AWS_DEPLOYMENT=NOT_PERFORMED"
          echo "D031_PRODUCTION_FINANCIAL_APPLY=BLOCKED"
