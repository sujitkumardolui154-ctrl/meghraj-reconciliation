name: DB-R31.11.2 Minimal Combined Security Gate (No Financial Tests)
on:
  push:
    branches:
      - feature/sbi-r31-11-2-minimal-combined-security-gate-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-shot-security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal offline security contracts ONLY
        run: python -m unittest discover -s staging/aws_login_v150 -p 'test_r31_11_2_minimal_combined_security.py' -v
      - name: Compile minimal combined QA module
        run: python -m py_compile staging/aws_login_v150/r31_11_2_minimal_combined_security.py
