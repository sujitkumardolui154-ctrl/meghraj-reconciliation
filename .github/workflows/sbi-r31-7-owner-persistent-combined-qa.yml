name: SBI R31.7 Combined Persistent Owner Payment Source QA (Isolated Only)
on:
  push:
    branches:
      - integration/sbi-r31-7-owner-combined-isolated-ci-20261125
  pull_request:
    branches:
      - sbi-central-postgresql-main-20261121
permissions:
  contents: read

jobs:
  combined-source-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ec5f175aad8c3d7897333e48374b00ba0f174328
          path: r31-pinned-app
          persist-credentials: false
      - name: Source-only safety assertions and unit regressions
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            database/stage31/db_r31_owner_source_adapter.py \
            database/stage31/db_r31_owner_report_adapter.py \
            database/stage31/db_r31_owner_qa_runtime.py \
            database/stage31/db_r31_owner_qa_combined.py
          python3 -m unittest discover -s database/stage31 \
            -p 'test_db_r31_owner_source_adapter.py' -v
          python3 -m unittest discover -s database/stage31 \
            -p 'test_db_r31_owner_report_adapter.py' -v
          python3 -m unittest discover -s database/stage31 \
            -p 'test_db_r31_owner_persistent_qa.py' -v
          python3 - <<'PY'
          from pathlib import Path
          source=Path('database/stage31/db_r31_owner_qa_combined.py').read_text()
          assert 'PG="sbi-synthetic-postgres-38-31"' in source
          assert 'NETWORK="sbi-synthetic-isolated-38-31"' in source
          assert 'DB="sbi_r31_owner_qa_20261125"' in source
          assert "if db_exists(\"sbi_reconciliation_main\")" in source
          assert 'pg_dump' in source and '--schema-only' in source
          assert 'DB_R31_PRODUCTION_DATABASE_WRITES=NONE_BY_TEST' in source
          print('DB_R31_7_OWNER_STAGE_SCOPE_AUDIT=PASS')
          PY
      - name: Build SHA-pinned R31 parser image with QA-only psycopg driver
        run: |
          set -Eeuo pipefail
          docker build \
            -f r31-pinned-app/staging/aws_login_v150/Dockerfile \
            --build-arg SBI_SOURCE_SHA=ec5f175aad8c3d7897333e48374b00ba0f174328 \
            -t "sbi-r31-base:${GITHUB_SHA}" r31-pinned-app
          docker build \
            -f database/stage31/Dockerfile.pg-report-private-qa \
            --build-arg BASE_IMAGE="sbi-r31-base:${GITHUB_SHA}" \
            -t "sbi-r31-7-owner-qa:${GITHUB_SHA}" .
          docker run --detach --name sbi-pr129-modern-release-final \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            "sbi-r31-7-owner-qa:${GITHUB_SHA}" \
            python3 -c 'import time;time.sleep(1200)'
          docker inspect -f '{{.Image}} {{.State.Status}}' sbi-pr129-modern-release-final
          echo 'DB_R31_7_PINNED_APP_IMAGE=BUILT_OFFLINE'
      - name: Create internal synthetic FT04 PostgreSQL (never main DB)
        run: |
          set -Eeuo pipefail
          docker network create --internal sbi-synthetic-isolated-38-31
          docker run --detach --name sbi-synthetic-postgres-38-31 \
            --network sbi-synthetic-isolated-38-31 \
            --env POSTGRES_DB=sbi_ft04g_clean_0e858f93 \
            --env POSTGRES_PASSWORD=SYNTHETIC_CI_ONLY_20261125 \
            postgres:16-alpine
          ready=0
          for i in $(seq 1 60); do
            if docker exec sbi-synthetic-postgres-38-31 \
                pg_isready -h 127.0.0.1 -U postgres \
                -d sbi_ft04g_clean_0e858f93 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == 1 ]] || exit 1
          docker exec sbi-synthetic-postgres-38-31 \
            psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "SELECT datname FROM pg_database WHERE datname='sbi_reconciliation_main'" |
              (! grep -q .)
          for sql in \
             database/stage31/db_r31_ft04_qa_seed.sql \
             database/stage31/db_r31_additive_qa_up.sql; do
            docker exec -i sbi-synthetic-postgres-38-31 \
               psql -X -qAt -v ON_ERROR_STOP=1 -U postgres \
               -d sbi_ft04g_clean_0e858f93 < "$sql"
          done
          echo 'DB_R31_7_FT04_QA_ISOLATED_SCHEMA=PASS'
      - name: Prepare private QA-only credential directory (no credentials in repo)
        run: |
          set -Eeuo pipefail
          # GitHub-hosted disposable runner may not provide a traversable
          # /home/ubuntu home path. Prepare it here, never on AWS.
          sudo -n install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /home/ubuntu
          sudo -n install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" \
            /home/ubuntu/sbi-db-management
          sudo -n install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" \
            /home/ubuntu/sbi-db-management/db-r31-ownerqa
          test "$(stat -c '%a' /home/ubuntu/sbi-db-management/db-r31-ownerqa)" = 700
          echo 'DB_R31_7_EPHEMERAL_CREDENTIAL_DIRECTORY=PASS'
      - name: Run exact R31.7 combined QA clone and approved source parser
        run: |
          set -Eeuo pipefail
          python3 database/stage31/db_r31_owner_qa_combined.py |
            tee "${RUNNER_TEMP}/r31-7-combined.log"
          for marker in \
            'DB_R31_PHYSICAL_QA_ISOLATION=PASS' \
            'DB_R31_QA_SCHEMA_ONLY_CLONE=PASS' \
            'DB_R31_OWNER_QA_SCHEMA_PERSISTED|PASS' \
            'DB_R31_DISTINCT_RESTRICTED_QA_ROLES=PASS' \
            'DB_R31_LIVE_APP_PARSER_MIXED_EVIDENCE=PASS' \
            'DB_R31_TWO_OWNER_SAME_SHA_PERSISTENT_QA=PASS' \
            'DB_R31_DUPLICATE_REPLAY_NO_NEW_WRITES=PASS' \
            'DB_R31_INVALID_SOURCE_ROWS_AND_STATUS=PASS' \
            'DB_R31_OWNER_FILTERED_SQL_AND_CSV_PARITY=PASS' \
            'DB_R31_NO_UNVERIFIED_RECONCILIATION=PASS' \
            'DB_R31_FT04_QA_EXISTING_ROW_COUNTS_UNCHANGED=PASS' \
            'DB_R31_PRODUCTION_DATABASE_WRITES=NONE_BY_TEST' \
            'DB_R31_REAL_FIREBASE_AUTH=NOT_TESTED' \
            'DB_R31_RELEASE_STATUS=ISOLATED_PERSISTENT_SOURCE_QA_ONLY'; do
             grep -F "$marker" "${RUNNER_TEMP}/r31-7-combined.log" >/dev/null ||
             { echo "DB_R31_7_REQUIRED_MARKER_MISSING"; exit 1; }
          done
          echo 'DB_R31_7_OWNER_FT04_POSTGRES_SOURCE_REPORT_INTEGRATION=PASS'
          echo 'DB_R31_7_AWS_HOST_DEPLOYMENT=NOT_PERFORMED'
      - name: Dispose containers, private QA credentials and isolated network
        if: always()
        run: |
          docker rm -f sbi-synthetic-postgres-38-31 \
            sbi-pr129-modern-release-final >/dev/null 2>&1 || true
          docker network rm sbi-synthetic-isolated-38-31 >/dev/null 2>&1 || true
          sudo -n rm -rf /home/ubuntu/sbi-db-management/db-r31-ownerqa || true
          echo 'DB_R31_7_EPHEMERAL_QA_DESTROYED=YES'
