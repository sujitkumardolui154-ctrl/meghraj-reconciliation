name: SBI R31.11.4D2 rollback-only tenant RLS QA
on:
  push:
    branches: [feature/sbi-r31-11-4d2-rollback-tenant-rls-20261127]
  pull_request:
    paths:
      - staging/aws_login_v150/r31_11_4d2_rollback_rls_acceptance.sql
      - .github/workflows/sbi-r31-11-4d2-rollback-rls-qa.yml
permissions:
  contents: read
jobs:
  pg16-rollback-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sbi_r31_11_4_auth_qa_20261126
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only_not_for_aws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: sbi_r31_11_4_auth_qa_20261126
      PGPASSWORD: synthetic_ci_only_not_for_aws
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap PG16 RLS and CI-fake UID mappings
        shell: bash
        run: |
          set -euo pipefail
          psql -X -qAt -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_4b_schema_only_up.sql
          psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE ROLE r3113_login_a LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE r3113_login_b LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT r311_qa_tenant_a TO r3113_login_a WITH INHERIT TRUE, SET FALSE, ADMIN FALSE;
          GRANT r311_qa_tenant_b TO r3113_login_b WITH INHERIT TRUE, SET FALSE, ADMIN FALSE;
          INSERT INTO r311_auth.role_owner_map(db_role,owner_uid) VALUES
            ('r3113_login_a','r3114d2-fake-ci-owner-a'),
            ('r3113_login_b','r3114d2-fake-ci-owner-b');
          COMMIT;
          SQL
      - name: Run actual PostgreSQL 16 rollback RLS test
        shell: bash
        run: |
          set -euo pipefail
          SQL=staging/aws_login_v150/r31_11_4d2_rollback_rls_acceptance.sql
          ! grep -Eq '^[[:space:]]*COMMIT[[:space:]]*;' "$SQL"
          psql -X -qAt -v ON_ERROR_STOP=1 -f "$SQL" | tee /tmp/rls-result
          for code in \
            DB_R31_11_4D2_PRECHECK=PASS_EXACT_PRIVATE_QA_EMPTY \
            DB_R31_11_4D2_SYNTHETIC_FIXTURES=PASS_TWO_EACH_UNCOMMITTED \
            DB_R31_11_4D2_TENANT_A_OWN_READ=PASS \
            DB_R31_11_4D2_TENANT_A_CROSS_READ=DENIED_PASS \
            DB_R31_11_4D2_TENANT_A_MAP_AND_WRITE=DENIED_PASS \
            DB_R31_11_4D2_TENANT_B_OWN_READ=PASS \
            DB_R31_11_4D2_TENANT_B_CROSS_READ=DENIED_PASS \
            DB_R31_11_4D2_TENANT_B_MAP_AND_WRITE=DENIED_PASS \
            DB_R31_11_4D2_TRANSACTION=ROLLBACK_COMPLETE; do
            grep -Fqx "$code" /tmp/rls-result
          done
          psql -X -qAt -v ON_ERROR_STOP=1 -c "
          BEGIN READ ONLY;
          SELECT 'ZERO_SOURCE_ROWS=' || CASE WHEN
            (SELECT count(*) FROM sbi.import_batches)+
            (SELECT count(*) FROM sbi.payment_source_rows)+
            (SELECT count(*) FROM sbi.payments)+
            (SELECT count(*) FROM sbi.payment_source_status_v1)=0
            THEN 'PASS' ELSE 'FAIL' END;
          SELECT 'OWNER_MAPPING_INTACT=' || CASE WHEN
            (SELECT count(*) FROM r311_auth.role_owner_map)=2
            THEN 'PASS' ELSE 'FAIL' END;
          COMMIT;" | tee /tmp/rls-after
          grep -Fqx 'ZERO_SOURCE_ROWS=PASS' /tmp/rls-after
          grep -Fqx 'OWNER_MAPPING_INTACT=PASS' /tmp/rls-after
      - name: Inject test-only RLS leak and require the QA SQL to fail closed
        shell: bash
        run: |
          set -euo pipefail
          psql -X -qAt -v ON_ERROR_STOP=1 -c "ALTER POLICY r311_batch_read ON sbi.import_batches USING (true)"
          if psql -X -qAt -v ON_ERROR_STOP=1 -f staging/aws_login_v150/r31_11_4d2_rollback_rls_acceptance.sql; then
            echo 'STOP=CI_FAIL_OPEN_RLS_LEAK_NOT_DETECTED'
            exit 1
          fi
          echo 'DB_R31_11_4D2_INJECTED_RLS_LEAK=DETECTED_PASS'
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN (SELECT count(*) FROM sbi.import_batches)+(SELECT count(*) FROM sbi.payment_source_rows)+(SELECT count(*) FROM sbi.payments)+(SELECT count(*) FROM sbi.payment_source_status_v1)=0 THEN 'ROLLBACK_AFTER_FAILURE=PASS' ELSE 'ROLLBACK_AFTER_FAILURE=FAIL' END" | grep -Fqx 'ROLLBACK_AFTER_FAILURE=PASS'
