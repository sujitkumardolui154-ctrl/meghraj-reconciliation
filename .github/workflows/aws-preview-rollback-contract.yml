name: AWS preview rollback contract
on:
  pull_request:
    paths:
      - 'staging/aws_lightsail/consolidated_release.sh'
      - 'tests/test_aws_preview_rollback_gate.py'
      - '.github/workflows/aws-preview-rollback-contract.yml'
  push:
    branches: [main]
    paths:
      - 'staging/aws_lightsail/consolidated_release.sh'
      - 'tests/test_aws_preview_rollback_gate.py'
      - '.github/workflows/aws-preview-rollback-contract.yml'
permissions:
  contents: read
jobs:
  rollback-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated source-only rollback regression
        run: python -m unittest discover -s tests -p 'test_aws_preview_rollback_gate.py' -v
