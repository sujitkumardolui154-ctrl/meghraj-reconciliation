name: SBI Stage 6 Full Application Migration — source audit
on:
  push:
    branches:
      - feature/sbi-stage6-full-gcloud-to-aws-migration-20261104
  pull_request:
    paths:
      - staging/aws_lightsail/stage6_source_migration_audit.py
      - tests/test_aws_stage6_source_migration.py
      - docs/SBI_STAGE6_FULL_GCLOUD_TO_AWS_MIGRATION.md
      - .github/workflows/sbi_stage6_migration.yml
      - staging/aws_lightsail/Dockerfile.stage6b
      - staging/aws_lightsail/Dockerfile.stage6b.dockerignore
      - staging/aws_lightsail/stage6b_build_guard.py
      - tests/test_aws_stage6b_dashboard_package.py
      - dashboard_source/stage6_origin_policy.py
      - dashboard_source/stage6_aws_guard.py
      - dashboard_source/dashboard_sessions.py
      - dashboard_source/production_gateway.py
      - tests/test_aws_stage6c_auth_profile.py
      - staging/aws_lightsail/stage6c4_firebase_probe.py
      - tests/test_aws_stage6c4_firebase_probe.py
      - staging/aws_lightsail/stage6d_lightsail_integration_audit.py
      - tests/test_aws_stage6d_lightsail_integration.py
      - AGENTS.md
      - tests/test_stage6_deployment_governance.py
      - staging/aws_lightsail/stage6d_combined_check.sh
      - staging/aws_lightsail/stage6d3_local_http_batch.sh
      - tests/test_aws_stage6d3_http_batch_contract.py
      - dashboard_source/stage6d_private_entry.py
      - staging/aws_lightsail/Dockerfile.stage6d
      - staging/aws_lightsail/Dockerfile.stage6d.dockerignore
      - tests/test_aws_stage6d_private_candidate.py
permissions:
  contents: read
jobs:
  stage6-source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline audit regression
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6_source_migration.py -v
      - name: Stage 6B full dashboard package source contract
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6b_dashboard_package.py -v
      - name: Stage 6C AWS authentication profile dependencies (offline tests only)
        run: python3 -m pip install 'Flask>=3.1,<4'
      - name: Stage 6C exact origins, fail-closed backend and compatibility tests
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6c_auth_profile.py -v
      - name: Stage 6C-4 AWS WIF Firebase probe fail-closed tests
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6c4_firebase_probe.py -v
      - name: Stage 6D Lightsail full-app integration audit (offline)
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6d_lightsail_integration.py -v
      - name: Enforce owner Lightsail-first governance
        run: python3 -B -m unittest discover -s tests -p test_stage6_deployment_governance.py -v
      - name: Stage 6D private candidate launch and finance-denial tests
        run: python3 -B -m unittest discover -s tests -p test_aws_stage6d_private_candidate.py -v
      - name: Stage 6D combined test runner shell syntax (no Docker execution)
        run: bash -n staging/aws_lightsail/stage6d_combined_check.sh
      - name: Stage 6D.3 localhost HTTP batch syntax and safety (no server launched)
        run: |
          bash -n staging/aws_lightsail/stage6d3_local_http_batch.sh
          python3 -B -m unittest discover -s tests -p test_aws_stage6d3_http_batch_contract.py -v
      - name: Stage 6 full app source report (no secrets, no cloud access)
        run: python3 -B staging/aws_lightsail/stage6_source_migration_audit.py --repo . > /tmp/sbi-stage6-inventory.json
      - name: Check explicit release blocking gate
        run: python3 -c 'import json; d=json.load(open("/tmp/sbi-stage6-inventory.json")); assert d["financial_writes"] == 0 and d["production_change"] is False and "BLOCKED" in d["stage6_release_gate"]'
