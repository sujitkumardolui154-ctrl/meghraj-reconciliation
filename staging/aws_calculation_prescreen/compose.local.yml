# Isolated local/private staging only; does NOT touch live AWS preview/Caddy.
# Credentials must be injected via environment/secrets by an authorized operator.
services:
  sbi-calc-prescreen-staging:
    image: "sbi-calc-prescreen:${SBI_CALC_RELEASE_SHA:-unreleased}"
    build:
      context: ../..
      dockerfile: staging/aws_calculation_prescreen/Dockerfile
      args:
        SBI_SOURCE_SHA: "${SBI_CALC_RELEASE_SHA:-UNVERIFIED}"
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    environment:
      SBI_CALC_PREVIEW_ENABLED: "${SBI_CALC_PREVIEW_ENABLED:-false}"
      SBI_FINANCIAL_APPLY: LOCKED
      SBI_CALC_PREVIEW_USERNAME: "${SBI_CALC_PREVIEW_USERNAME:-}"
      SBI_CALC_PREVIEW_PASSWORD: "${SBI_CALC_PREVIEW_PASSWORD:-}"
    # Loopback bind; never publish this app to public AWS/Caddy.
    ports:
      - "127.0.0.1:18088:8080"
